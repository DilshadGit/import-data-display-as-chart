{% extends 'base.html' %}

{% load static %}
{% load django_bootstrap5 %}
{% load crispy_forms_tags %}

{% block title %}Login{% endblock title %}

{% block content %}

<div class="login-container">
    <div class="row ml-3">
        <div class="col-lg-4 cols-md-6 col-sm-3 g-3">
            <h2 class="mt-3">User Login</h2>
            <div class="form-group">
                <form method="POST" class="form-control mr-8 pt-2" action="" enctype='multipart/form-data' multiple>
                    {% csrf_token %}
                    {{ form|crispy }}

                    <button type="submit" class="btn btn-primary">Login</button>

                    <a href="{% url 'accounts:reset_password' %}" class="btn btn-primary bottom-right" value="Reset">Reset Password?</a>

                </form>

            </div>

        </div>
    </div>
</div>

{% endblock  %}
