{% extends 'base.html' %}

{% load static %}
{% load django_bootstrap5 %}
{% load crispy_forms_tags %}

{% block title %}Sin-up{% endblock title %}

{% block content %}

<div class="login-container">
    <h2 class="mt-3">Sign-up</h2>
    <div class="row ml-3">
        <div class="form-group">
            <div class="col-lg-6 cols-md-6 col-sm-3 g-3">
                <form method="POST" class="mr-8" action="" enctype='multipart/form-data' multiple>
                    {% csrf_token %}
                    {{ form|crispy  }}
                    <button type="submit" class="btn btn-primary">Sign-up</button>
                </form>
                <p class="mt-3">If you have an account go to Login <a href="{% url 'accounts:login' %}">Here</a> </p>
            </div>
        </div>
    </div>
</div>
<br>

{% endblock  %}
