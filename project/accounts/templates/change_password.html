{% extends 'base.html' %}

{% load static %}
{% load django_bootstrap5 %}
{% load crispy_forms_tags %}

{% block title %}Change Password{% endblock title %}


{% block content %}
<h2 class="text-left mt-3">Change Password</h2>

<div class="form-group">
    <div class="row ml-3">
        <div class="col-lg-5 cols-md-6 col-sm-3 g-3">
           <form method="POST" action="" class="form-control mb-5">
               {% csrf_token %}
               {{ form|crispy }}
               <button type="submit" class="btn btn-primary right">Change Password</button>
           </form>
        </div>
    </div>
</div>
{%  endblock  %}
