{%  load static %}
{% load django_bootstrap5 %}

<div class="container-fluid">
    <nav class="navbar navbar-default mb-4">
        <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start">
            <a class="navbar-brand" href="{% url 'consumption:home' %}">Gas Energy</a>
        </div>

        <ul class="navbar col-12 col-lg-auto me-lg-auto mb-2 justify-content-center mb-md-0">
            <li class="nav"><a href="{% url 'consumption:home' %}" class="nav-link px-2 text-secondary">Home</a></li>
            <li class="nav"><a href="#" class="nav-link px-2 text-white">Features</a></li>
            <li class="nav"><a href="#" class="nav-link px-2 text-white">Pricing</a></li>
            <li class="nav"><a href="#" class="nav-link px-2 text-white">FAQs</a></li>
            <li class="nav"><a href="#" class="nav-link px-2 text-white">About</a></li>
        </ul>

        <form class="col-12 col-lg-auto mb-3 mb-lg-0 me-lg-3" role="search">
            <input type="search" class="form-control" placeholder="Search..." aria-label="Search">
        </form>

        <div class="text-end">
            {% if request.user.is_authenticated %}
                <a href="{% url 'accounts:logout' %}">
                    <button type="button" class="btn btn-outline-light me-2">Logout</button>
                </a>
                <a href="{% url 'accounts:profile' %}">
                    <button type="button" class="btn btn-warning">Profile</button>
                </a>
            {%  else %}
                <a href="{% url 'accounts:login' %}">
                    <button type="button" class="btn btn-outline-light me-2">Login</button>
                </a>
                <a class="pl-3" href="{% url 'accounts:register' %}">
                    <button type="submit" class="btn btn-outline-light pl-4">Sin-up</button>
                </a>
            {% endif %}
        </div>
    </nav>
</div>
